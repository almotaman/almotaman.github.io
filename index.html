<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10131a">
    <meta name="description" content="Log gym workout sets from your phone.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <title>Gym Tracker</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">GYM TRACKER</div>
      <div id="machine-name" class="machine-name">Machine</div>
    </header>

    <main id="app" class="app-shell" aria-live="polite">
      <section id="enroll-screen" class="screen" hidden>
        <h1>Welcome</h1>
        <p class="intro">Enter your gym details to get started.</p>
        <form id="enroll-form" novalidate>
          <label for="gym-id">Gym ID</label>
          <input id="gym-id" name="gym_id" required autocomplete="organization" maxlength="100">
          <label for="phone-last4">Last 4 digits of phone</label>
          <input id="phone-last4" name="phone_last4" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off">
          <p id="enroll-error" class="error" role="alert"></p>
          <button type="submit" class="primary-button">Enroll</button>
        </form>
      </section>

      <section id="set-screen" class="screen" hidden>
        <p id="greeting" class="greeting"></p>
        <h1 id="set-machine-name">Machine</h1>
        <form id="set-form" novalidate>
          <div class="input-row">
            <div>
              <label for="weight">Weight (kg)</label>
              <input id="weight" name="weight_kg" type="number" min="0" max="500" step="0.5" required inputmode="decimal">
            </div>
            <div>
              <label for="reps">Reps</label>
              <input id="reps" name="reps" type="number" min="1" max="100" step="1" required inputmode="numeric">
            </div>
          </div>
          <p id="set-error" class="error" role="alert"></p>
          <button id="log-button" type="submit" class="primary-button">Log set</button>
        </form>
        <section id="confirmation" class="confirmation" hidden>
          <strong id="confirmation-message"></strong>
          <span id="rest-message"></span>
          <span id="timer-label">Rest</span>
          <div id="timer" class="timer" aria-live="off"></div>
          <button id="skip-button" type="button" class="secondary-button">Skip</button>
        </section>
      </section>
    </main>

    <footer><button id="not-you" type="button" class="link-button">Not you?</button></footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
